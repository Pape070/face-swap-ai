name: desktop-exe

on:
  push:
    paths:
      - "desktop/**"
      - "face_swap.py"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -c "import urllib.request,os; os.makedirs('models',exist_ok=True); urllib.request.urlretrieve('https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx','models/face_detection_yunet_2023mar.onnx')"
      - run: pyinstaller --noconfirm --clean desktop/HeadSwapStudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: HeadSwapStudio-${{ matrix.os }}
          path: dist/
